# Supabase Local Configuration for IDEORA
project_id = "ideora"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5174", "https://ideora.vercel.app"]
jwt_expiry = 3600

[storage]
enabled = true
file_size_limit = "50MiB"
