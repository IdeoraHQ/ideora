<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IDEORA — Where Ideas Find Their Builders</title>
    <meta
      name="description"
      content="The venture-grade co-founding and idea-adoption network. Discover promising initiatives, assemble senior engineering teams, and build real-world software."
    />
    <link rel="canonical" href="https://ideorahq.top/" />

    <!-- Open Graph / Facebook / LinkedIn / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="IDEORA" />
    <meta property="og:url" content="https://ideorahq.top/" />
    <meta property="og:title" content="IDEORA — Where Ideas Find Their Builders" />
    <meta
      property="og:description"
      content="The venture-grade co-founding and idea-adoption network. Discover promising initiatives, assemble senior engineering teams, and build real-world software."
    />
    <meta property="og:image" content="https://ideorahq.top/og-image.png" />
    <meta property="og:image:secure_url" content="https://ideorahq.top/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1024" />
    <meta property="og:image:height" content="541" />
    <meta property="og:image:alt" content="IDEORA — Where Ambitious Ideas Find Their Builders" />

    <!-- Twitter / X Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@IdeoraHQ" />
    <meta name="twitter:title" content="IDEORA — Where Ideas Find Their Builders" />
    <meta
      name="twitter:description"
      content="The venture-grade co-founding and idea-adoption network. Discover promising initiatives, assemble senior engineering teams, and build real-world software."
    />
    <meta name="twitter:image" content="https://ideorahq.top/og-image.png" />

    <!-- Structured Data (JSON-LD) for Production Domain -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "IDEORA",
        "url": "https://ideorahq.top/",
        "description": "Where ambitious ideas find their builders. Co-founding and idea-adoption network.",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://ideorahq.top/explore?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
    <!-- Font Preconnect & Outfit Family -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" href="/fonts/outfit-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap"
    />
  </head>
  <body class="bg-[#F8FAFC] font-sans text-[#1E293B] antialiased selection:bg-[#2563EB] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
